<div class="pagina">

  <div class="login-container">

    <!-- Avatar -->
    <div class="avatar">
      <div class="avatar-cabeca"></div>
      <div class="avatar-corpo"></div>
    </div>

    <!-- Formulário -->
    <div class="form">

      <!-- Usuário -->
      <div class="input-group">
        <div class="icon">
  
        </div>

        <input
          type="text"
          placeholder="Usuario"
        >
      </div>

      <!-- Senha -->
      <div class="input-group">
        <div class="icon">
          
        </div>

        <input
          type="password"
          placeholder="Senha"
        >
      </div>

      <!-- Opções -->
      <div class="options">

        <label>
          <input type="checkbox">
          <span>Relembrar Cadastro</span>
        </label>

        <a href="#">
          Esqueci minha senha
        </a>

      </div>

      <!-- Criar conta -->
      <button class="btn-primary">
        Criar Conta
      </button>

    </div>

    <!-- Login -->
    <a
      routerLink="/login"
      class="btn-secondary"
    >
      Login
    </a>

  </div>

</div>
