<div class="pagina">

  <div class="logout-container">

    <!-- Formulário -->
    <div class="form">

      <!-- Usuário -->
      <div class="input-group">
        <div class="icon">
  
        </div>

        <input
          type="text"
          placeholder="Novo Usuario"
        >
      </div>

      <!--E-mail-->
      <div class="input-group">
        <div class="icon">
        </div>

          <input type="E-mail"
          placeholder="Digite seu e-mail">
        
      </div>

      <!-- Senha -->
      <div class="input-group">
        <div class="icon">
          
        </div>

        <input
          type="password"
          placeholder="Crie a sua senha">
        
      </div>


      <!-- Criar conta -->
      <button class="btn-primary">
        <a class="btn-login" href="login">Criar Conta</a>
      </button>

    </div>

    <!-- Login -->
    <a
      routerLink="/login"
      class="btn-secondary"
    >
      Login
    </a>

  </div>

</div>

<div class="imagens">
  <div class="logo">
    <img class="logo1" src="assets/imagens/Logo.svg">
     <img src="../../../assets/imagens/_-Photoroom 3.svg">
  </div>
</div>
